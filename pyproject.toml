[project]
name = "agent-knowledge-forge"
version = "0.1.0"
description = "Multi-agent knowledge pipeline for frontier AI-agent engineering."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Agent Knowledge Forge contributors" }
]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "chromadb>=0.5.23",
  "crawl4ai>=0.4.247",
  "httpx>=0.27.2",
  "langchain-openai>=0.2.14",
  "langgraph>=0.2.60",
  "markdownify>=0.13.1",
  "mcp>=1.2.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "rich>=13.9.4",
  "tenacity>=9.0.0",
  "tiktoken>=0.8.0",
  "typer>=0.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
]
local-embeddings = [
  "sentence-transformers>=3.3.1",
]

[project.scripts]
akf = "agent_knowledge_harvester.cli:app"
harvester = "agent_knowledge_harvester.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_knowledge_harvester"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agent_knowledge_harvester",
  "tests",
  "scripts",
  "README.md",
  "LICENSE",
  ".env.example",
  "requirements.txt",
  "Makefile",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
